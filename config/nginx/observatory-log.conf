# Access-log format the dashboard's traffic collector parses
# (server/collectors/nginx.js): nginx's "combined" format plus $request_time.
#
# Install (http context, picked up by the conf.d include in nginx.conf):
#   sudo cp config/nginx/observatory-log.conf /etc/nginx/conf.d/
#
# Then in the `listen 443` server block of each app's site, add both lines
# (a server-level access_log replaces the http-level one, so keep the shared
# log too):
#   sportly.ca.conf:
#     access_log /var/log/nginx/access.log;
#     access_log /var/log/nginx/sportly.access.log observatory;
#   honeydoeh.mihyarmas.com.conf:
#     access_log /var/log/nginx/access.log;
#     access_log /var/log/nginx/honeydoeh.access.log observatory;
#   debt-manager.mihyarmas.com.conf:
#     access_log /var/log/nginx/access.log;
#     access_log /var/log/nginx/debtmanager.access.log observatory;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx creates the files as www-data:adm 0640; the dashboard's user is in
# adm, and /etc/logrotate.d/nginx already rotates /var/log/nginx/*.log.

log_format observatory '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" $request_time';
